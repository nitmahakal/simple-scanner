name: Bootstrap Extraction
on:
  workflow_dispatch:

jobs:
  extract:
    name: Extract Project ZIP into Repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download project ZIP from Release
        run: |
          echo "Downloading NSESimpleScanner_V1.zip from latest release..."
          curl -L -o project.zip "https://github.com/nitmahakal/simple-scanner/releases/latest/download/NSESimpleScanner_V1.zip"

      - name: Extract ZIP archive
        uses: ihiroky/extract-action@v1
        with:
          file_path: project.zip
          extract_dir: .

      - name: Move files to root & clean up
        run: |
          # Move inner folder contents to repo root, if needed
          if [ -d "nse_simple_scanner" ]; then
            mv nse_simple_scanner/* ./
            mv nse_simple_scanner/.github ./
            rm -rf nse_simple_scanner
          fi
          # Remove the downloaded ZIP and any temp files
          rm -f project.zip

      - name: Remove bootstrap workflow file
        run: |
          rm -f .github/workflows/bootstrap-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bootstrap-extract.yml
          git commit -m "Remove bootstrap workflow file"

      - name: Commit all extracted files
        run: |
          git add .
          git commit -m "Bootstrap: Add project files from ZIP"
          git push
