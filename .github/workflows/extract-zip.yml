name: Extract and Import ZIP

# Trigger on push of any ZIP or manual dispatch
on:
  push:
    # Only run when a .zip file is pushed
    paths:
      - '**/*.zip'
  workflow_dispatch:  # allows manual trigger

permissions:
  contents: write  # needed for git commit/push

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract project ZIP
        run: |
          # Remove the bootstrap workflow so it won't persist
          rm -f .github/workflows/extract-zip.yml

          # Unzip the ZIP file (there should be exactly one .zip in root)
          unzip '*.zip'
          # Remove the uploaded ZIP now that we've extracted it
          rm -f *.zip

          # If unzip created a single directory, move its contents up
          top_dir=$(ls -1d */ | head -n 1)
          if [ -d "$top_dir" ]; then
            mv "$top_dir"* .
            rm -rf "$top_dir"
          fi

          # Configure Git and commit all changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initial project import from ZIP" || echo "No changes to commit"
          git push origin HEAD:main

