plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.babunator.scanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.babunator.scanner'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Fixed signing key used by CI so every APK has the same signature
    // (otherwise updates fail and app data is lost on reinstall).
    // The keystore file is written by the GitHub workflow from secrets;
    // when it is not present the normal debug key is used as before.
    signingConfigs {
        ci {
            def ks = file('ci-signing.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (file('ci-signing.jks').exists()) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
}
